name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  ci:
    name: Linux AMD64 quality
    runs-on: ubuntu-22.04
    env:
      BPF2GO_CC: clang-14
      BPF2GO_STRIP: llvm-strip-14
      GONOSUMDB: ""
      GOPRIVATE: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            pkg-config \
            clang \
            clang-format \
            llvm \
            libelf-dev \
            linux-headers-generic \
            linux-libc-dev \
            openjdk-17-jdk-headless

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 14
          platform: any
      
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CI
        run: make ci
