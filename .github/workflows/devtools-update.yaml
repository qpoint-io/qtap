name: Update DevTools

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-devtools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run build-devtools
        run: make build-devtools

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Update devtools
          branch: auto/build-devtools
          delete-branch: true
          title: "[auto] Update devtools build"
          body: "This is an automated PR to update the devtools build."
