name: e2e

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  e2e:
    # ubuntu-latest is moving to kernel 7.0.0-1017-azure, where BPF programs on
    # syscall-enter tracepoints with user-pointer arguments (sys_enter_write,
    # ...) run only on CPU 0, so most captured traffic is lost.
    # Move back to ubuntu-latest once Ubuntu ships the fix:
    # https://bugs.launchpad.net/ubuntu/+source/linux/+bug/2170225
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            clang-format \
            libelf-dev \
            linux-headers-generic \
            linux-libc-dev \
            llvm \
            openjdk-17-jdk \
            pkg-config

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 14
          platform: any

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build JVM assets
        run: make build-jvm

      - name: Verify process discovery ownership
        run: sudo "$(command -v go)" test -tags integration -count=1 ./pkg/process

      - name: Verify external process consumer
        working-directory: examples/process-monitor
        run: sudo "$(command -v go)" test -mod=readonly -tags integration -count=1 ./...

      - name: Run E2E tests
        env:
          JUNIT_REPORT: true
        run: sudo make e2e

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "/tmp/e2e-tests-results.xml"
        if: always()
