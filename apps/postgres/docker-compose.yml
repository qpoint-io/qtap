services:
  # PostgreSQL server
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - ./certs:/certs:ro
    environment:
      - POSTGRES_PASSWORD=testpassword
      - POSTGRES_DB=testdb
      - POSTGRES_TLS_ENABLED=${POSTGRES_TLS_ENABLED:-false}
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    command: >
      sh -c '
        if [ "$$POSTGRES_TLS_ENABLED" = "true" ] && [ -f /certs/server.crt ]; then
          echo "Starting PostgreSQL with TLS enabled (custom certs)"
          cp /certs/ca.crt /certs/server.crt /certs/server.key /tmp/
          chmod 644 /tmp/ca.crt /tmp/server.crt
          chmod 600 /tmp/server.key
          chown postgres:postgres /tmp/ca.crt /tmp/server.crt /tmp/server.key
          exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key -c ssl_ca_file=/tmp/ca.crt
        else
          echo "Starting PostgreSQL without custom TLS"
          exec docker-entrypoint.sh postgres
        fi
      '
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Ruby client
  ruby-client:
    build: ./ruby
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=testpassword
      - PG_DATABASE=testdb
      - PG_TLS_ENABLED=${POSTGRES_TLS_ENABLED:-false}
      - PG_CA_CERT=/certs/ca.crt
      - MAX_ITERATIONS=${MAX_ITERATIONS:-0}
      - SLEEP_DURATION=${SLEEP_DURATION:-1}

  # Go client
  go-client:
    build: ./go
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=testpassword
      - PG_DATABASE=testdb
      - PG_TLS_ENABLED=${POSTGRES_TLS_ENABLED:-false}
      - PG_CA_CERT=/certs/ca.crt
      - MAX_ITERATIONS=${MAX_ITERATIONS:-0}
      - SLEEP_DURATION=${SLEEP_DURATION:-1}

  # Java client
  java-client:
    build: ./java
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=testpassword
      - PG_DATABASE=testdb
      - PG_TLS_ENABLED=${POSTGRES_TLS_ENABLED:-false}
      - PG_CA_CERT=/certs/ca.crt
      - MAX_ITERATIONS=${MAX_ITERATIONS:-0}
      - SLEEP_DURATION=${SLEEP_DURATION:-1}

  # Node.js client
  node-client:
    build: ./node
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=testpassword
      - PG_DATABASE=testdb
      - PG_TLS_ENABLED=${POSTGRES_TLS_ENABLED:-false}
      - PG_CA_CERT=/certs/ca.crt
      - MAX_ITERATIONS=${MAX_ITERATIONS:-0}
      - SLEEP_DURATION=${SLEEP_DURATION:-1}
