# TLS Configuration for Redis
# Server-only TLS - clients verify server, server does not require client certs

# Disable non-TLS port, enable TLS on 6379
port 0
tls-port 6379

# Certificate paths (mounted from host)
tls-cert-file /certs/server.crt
tls-key-file /certs/server.key
tls-ca-cert-file /certs/ca.crt

# Disable client certificate authentication (server-only TLS)
tls-auth-clients no

# TLS protocol versions
tls-protocols "TLSv1.2 TLSv1.3"
