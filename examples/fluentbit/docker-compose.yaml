# Qtap with Fluent Bit Docker Compose Configuration
# =================================================
#
# This docker-compose file runs two services:
#
# 1. fluent-bit: Collects and processes logs from the Qtap container
#    - Configured via mounted configuration files
#    - Exposes port 24224 for log collection
#    - Can forward logs to various destinations (Axiom, S3, etc.)
#    - Uses environment variables for credentials
#
# 2. qtap: Monitors HTTP transactions using eBPF
#    - Runs with host networking and privileged access for eBPF functionality
#    - Forwards logs to fluent-bit for processing
#    - Requires elevated privileges for eBPF functionality
#
# To run this setup from the project root directory, use:
#
# docker compose -f examples/fluentbit/docker-compose.yaml --env-file examples/fluentbit/.env up
#
version: '3'

services:
  fluent-bit:
    image: fluent/fluent-bit:latest
    volumes:
      - ./:/fluent-bit/etc
      - /var/run/docker.sock:/var/run/docker.sock
    command: [ "fluent-bit", "-c", "/fluent-bit/etc/${FLUENTBIT_CONFIG:-basic-stdout.conf}" ]
    container_name: fluent-bit
    ports:
      - "24224:24224"
    environment:
      - AXIOM_DATASET=${AXIOM_DATASET}
      - AXIOM_API_KEY=${AXIOM_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}

  qtap:
    image: us-docker.pkg.dev/qpoint-edge/public/qtap:v0.9.7
    pid: host
    network_mode: host
    logging:
      driver: "fluentd"
      options:
        tag: docker.qtap
        fluentd-address: 127.0.0.1:24224
    depends_on:
      - fluent-bit
    user: "0:0"
    privileged: true
    cap_add:
      - CAP_BPF
      - CAP_SYS_ADMIN
    volumes:
      - /sys:/sys
      - ../:/qtap
    environment:
      - TINI_SUBREAPER=1
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command: >
      --log-level=info
      --config=/qtap/sample-config.yaml
