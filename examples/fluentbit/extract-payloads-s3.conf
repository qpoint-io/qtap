# Fluent Bit Configuration for Qtap HTTP Transaction Logging
# splitting the payloads out into separate records and storing them in S3
# =====================================================
#
# This configuration file sets up Fluent Bit to:
#
# 1. Receive logs from Docker containers using the Fluentd forward protocol
# 2. Filter logs specifically from the Qtap container (tagged as docker.qtap)
# 3. Parse the logs as JSON using the generic_json_parser defined in parsers.conf
# 4. Identify HTTP transaction logs by matching the message "HTTP transaction"
# 5. Rewrite the tag for these HTTP transaction logs to "qtap.http"
# 6. Process payloads using a Lua script (s3-payloads.lua) to generate S3 URLs
# 7. Rewrite the tag for payload records to "qtap.http.payload"
# 8. Output HTTP transaction logs to stdout in JSON lines format
# 9. Store payload records in S3 using the configured endpoint, bucket, and region

# Ensure the parsers are loaded
[SERVICE]
    Parsers_File    parsers.conf

# Listen for logs forwarded via fluentd log driver
[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224

# Filter the logs to only tagged with docker.qtap, and parse them as JSON
[FILTER]
    Name        parser
    Match       docker.qtap
    Key_Name    log          
    Parser      generic_json_parser

# Rewrite tag for logs with the exact message "HTTP transaction"
[FILTER]
    Name            rewrite_tag
    Match           docker.qtap
    Rule            $msg "^HTTP transaction$" qtap.http false

# Lua filter to process payloads and generate S3 URLs
[FILTER]
    Name            lua
    Match           qtap.http
    Script          lua/s3-payloads.lua
    Call            process_payloads
    Protected_Mode   true

# Rewrite tag for payload records
[FILTER]
    Name            rewrite_tag
    Match           qtap.http
    Rule            $msg "^HTTP payload$" qtap.http.payload false

# Output the HTTP transaction logs to stdout, as individual lines of JSON
[OUTPUT]
    Name         stdout
    Match        qtap.http
    Format       json_lines

# Output the payload records to S3
[OUTPUT]
    Name                s3
    Match               qtap.http.payload
    endpoint            ${S3_ENDPOINT}
    bucket              ${S3_BUCKET}
    region              ${S3_REGION}
    s3_key_format       /$s3_key
    log_key             data

# Output all other docker.qtap logs to stdout
# [OUTPUT]
#     Name         stdout
#     Match        docker.qtap
#     Format       json_lines
