# This is a simple example of a qtap config that captures HTTP transactions and
# stores writes the transaction to an S3 bucket and prints a record to stdout
# which contains a URL to the transaction bucket item.
#
# A Minio instance be be started easily with docker:
# ```
# docker run \
#    -p 9000:9000 \
#    -p 9001:9001 \
#    --name minio \
#    -v ~/minio/data:/data \
#    -e "MINIO_ROOT_USER=root" \
#    -e "MINIO_ROOT_PASSWORD=password123" \
#    quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z-cpuv1 server /data --console-address ":9001"
# ```
# Ensure the correct IP that is is set in the qpoint config, so that other containers can reach it.
# This will likely be different from the IP used to access minio from your local machine.
#
# Note: We are using an older version of MinIO because they removed all the admin functionality
# from the webui in latest version which is a huge PITA.

version: 2
services:
  event_stores:
    - type: stdout
  object_stores:
    - type: s3
      endpoint: 172.17.0.3:9000 # REPLACE: with your minio endpoint
      bucket: qpoint-warehouse # REPLACE: with your minio bucket name
      insecure: true
      access_key:
        type: text
        value: <key> # REPLACE: with your minio access key
      secret_key:
        type: text
        value: <secret> # REPLACE: with your minio secret key
stacks:
  basic_reporting:
    plugins:
      - type: http_metrics
      - type: http_capture
        config:
          level: summary # (none|summary|details|full)
          format: text # (json|text)
          rules:
            - name: full log httpbin.org
              expr: http.req.host == "httpbin.org"
              level: full
            - name: details log on 500
              expr: http.res.status >= 500
              level: details
            - name: full log on 400
              expr: http.res.status >= 400 && http.res.status < 500
              level: full

      - type: report_usage
        # config:
        #   headers:
        #     - x-request-id
tap:
  direction: egress # (egress|egress-external|egress-internal)
  ignore_loopback: true
  audit_include_dns: false
  http:
    stack: basic_reporting
