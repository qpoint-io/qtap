# This is a simple example of a qtap config that captures HTTP transactions and
# stores writes them to stdout. This includes headers and bodies if the level is
# set to details or full.
#
version: 2
services:
  event_stores:
    - type: stdout
  object_stores:
    - type: stdout
stacks:
  basic_reporting:
    plugins:
      - type: http_metrics
      - type: report_usage
        # config:
        #   headers:
        #     - x-request-id
      - type: http_capture
        config:
          level: summary # (none|summary|headers|full)
          format: text # (json|text)
          rules:
            - name: full log httpbin.org
              expr: http.req.host == "httpbin.org"
              level: full
            - name: headers log on 500
              expr: http.res.status >= 500
              level: headers
            - name: full log on 400
              expr: is_4xx() # see rulekit config below
              level: full
            - name: full log on container label
              expr: src.container.labels.qpoint_debug_level == "debug"
              level: full
            - name: full log on pod label
              expr: src.pod.labels.qpoint_debug_level == "debug"
              level: full

# rulekit config
rulekit:
  macros:
    - name: is_4xx
      expr: http.res.status >= 400 && http.res.status < 500

# tap config
tap:
  direction: egress # (egress|egress-external|egress-internal)
  ignore_loopback: true
  audit_include_dns: false
  http:
    stack: basic_reporting
