version: 2
services:
  event_stores:
    - type: stdout
  object_stores:
    - type: stdout
stacks:
  basic_reporting:
    plugins:
      - type: http_metrics
      - type: access_logs
        config:
          mode: summary # (summary|details|full|none)
          format: console # (json|console)
          rules:
            - name: full log httpbin.org
              expr: http.req.host == "httpbin.org"
              mode: full
            - name: details log on 500
              expr: http.res.status >= 500
              mode: details
            - name: details log on example.com and any subdomains
              expr: in_zone(http.req.host, "example.com")
              mode: details
            - name: full log on 400
              expr: http.res.status >= 400 && http.res.status < 500
              mode: full
      - type: report_usage
        # config:
        #   # Promote HTTP headers into custom attributes on reported events.
        #   # Request headers become "req.<header>", response headers become "res.<header>".
        #   headers:
        #     - x-request-id
        #     - content-type
tap:
  direction: egress # (all|egress|egress-external|egress-internal|ingress)
  ignore_loopback: true
  audit_include_dns: false
  http:
    stack: basic_reporting
