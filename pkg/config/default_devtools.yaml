version: 2
services:
  event_stores:
    - type: disabled
  object_stores:
    - type: disabled
stacks:
  basic_reporting:
    plugins:
      - type: http_metrics
      # - type: access_logs
      #   config:
      #     mode: summary
      #     format: console
tap:
  direction: all
  ignore_loopback: false
  audit_include_dns: false
  http:
    stack: basic_reporting
  redis:
    stack: basic_reporting
  mysql:
    stack: basic_reporting
  postgres:
    stack: basic_reporting
